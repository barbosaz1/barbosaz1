<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 214" width="450" height="214" role="img" aria-label="xubz-theme (VS Code) - Premium dark VS Code theme where every colour carries meaning. Red = errors only.">
<title>xubz-theme (VS Code) - Premium dark VS Code theme where every colour carries meaning. Red = errors only.</title>
<defs>
  <linearGradient id="bgp2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10211C"/><stop offset="1" stop-color="#0A1613"/>
  </linearGradient>
  <linearGradient id="hlp2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clipp2"><rect x="6" y="6" width="438" height="202" rx="22"/></clipPath>
  <filter id="blurp2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,14px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-18px)}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(var(--shift))}}
  @keyframes sheen{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1300px)}}
  .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  .drift2{animation:drift2 18s ease-in-out infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  .fill{transform-box:fill-box;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.7,.2,1) both}
  .sheen{animation:sheen 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="6" y="6" width="438" height="202" rx="22" fill="url(#bgp2)"/>
<g clip-path="url(#clipp2)"><circle class="drift" cx="430" cy="10" r="110" fill="#2F80ED" opacity="0.2" filter="url(#blurp2)"/><circle cx="34" cy="40" r="5" fill="#2F80ED"/><text x="46" y="44.5" class="sans" font-size="12.5" font-weight="500" fill="#93A89F">VS Code</text><circle cx="410" cy="40" r="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1"/><path d="M405 45 l10 -10 M408 35 h7 v7" fill="none" stroke="#F2F5F1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="27" y="92" class="sans" font-size="23" font-weight="700" letter-spacing="-.6" fill="#F2F5F1">xubz-theme</text><text x="28" y="120" class="sans" font-size="13.5" fill="#93A89F">Premium dark VS Code theme where every</text><text x="28" y="140" class="sans" font-size="13.5" fill="#93A89F">colour carries meaning. Red = errors only.</text><rect x="28" y="164" width="61.7" height="24" rx="12.0" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".08"/><text x="40" y="180.0" class="sans" font-size="11.5" font-weight="500" fill="#C9D6D0">Theme</text><rect x="95.674" y="164" width="103.3" height="24" rx="12.0" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".08"/><text x="107.674" y="180.0" class="sans" font-size="11.5" font-weight="500" fill="#C9D6D0">Design system</text>
</g>
<rect x="6.5" y="6.5" width="437" height="201" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="28" y="6" width="394" height="1" fill="url(#hlp2)"/>
</svg>
