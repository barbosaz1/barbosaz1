<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" width="900" height="286" role="img" aria-label="11 public repos, 11 followers, 11 languages: Java 37%, TypeScript 25%, Rust 20%, CSS 7%, HTML 4%, Python 3%, Other 4%">
<title>11 public repos, 11 followers, 11 languages: Java 37%, TypeScript 25%, Rust 20%, CSS 7%, HTML 4%, Python 3%, Other 4%</title>
<defs>
  <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10211C"/><stop offset="1" stop-color="#0A1613"/>
  </linearGradient>
  <linearGradient id="hlm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clipm"><rect x="6" y="6" width="888" height="274" rx="26"/></clipPath>
  <filter id="blurm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
