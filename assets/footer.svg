<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Building bugs on purpose since 2024 - designed and compiled by Rodrigo Barbosa">
<title>Building bugs on purpose since 2024 - designed and compiled by Rodrigo Barbosa</title>
<defs>
  <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10211C"/><stop offset="1" stop-color="#0A1613"/>
  </linearGradient>
  <linearGradient id="hlf" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clipf"><rect x="6" y="6" width="888" height="138" rx="26"/></clipPath>
  <filter id="blurf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3DDC97" stop-opacity="0"/><stop offset=".3" stop-color="#3DDC97"/>
    <stop offset=".7" stop-color="#E9C46A"/><stop offset="1" stop-color="#E9C46A" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,14px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-18px)}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(var(--shift))}}
  @keyframes sheen{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1300px)}}
  .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  .drift2{animation:drift2 18s ease-in-out infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  .fill{transform-box:fill-box;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.7,.2,1) both}
  .sheen{animation:sheen 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="6" y="6" width="888" height="138" rx="26" fill="url(#bgf)"/>
<g clip-path="url(#clipf)"><circle class="drift" cx="450" cy="170" r="220" fill="#1F6F4A" opacity="0.55" filter="url(#blurf)"/><path d="M60 52 C 240 22, 360 82, 450 52 S 660 22, 840 52" fill="none" stroke="url(#wave)" stroke-width="1.5" opacity=".7"/><text x="450.0" y="96" text-anchor="middle" class="sans" font-size="19" font-weight="650" letter-spacing="-.3" fill="#F2F5F1">Building bugs on purpose since 2024 <tspan>🙏🏻</tspan></text><text x="450.0" y="122" text-anchor="middle" class="mono" font-size="11.5" fill="#5E736A">designed &amp; compiled by rodrigo barbosa  ·  printed on #0a1613  ·  🍃</text>
</g>
<rect x="6.5" y="6.5" width="887" height="137" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="32" y="6" width="836" height="1" fill="url(#hlf)"/>
</svg>
