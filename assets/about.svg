<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-label="About - Every interface is a promise. The code keeps it - the design makes people believe it. Studying Computer Engineering, building xiux, learning React and Spring Boot, based in Portugal.">
<title>About - Every interface is a promise. The code keeps it - the design makes people believe it. Studying Computer Engineering, building xiux, learning React and Spring Boot, based in Portugal.</title>
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10211C"/><stop offset="1" stop-color="#0A1613"/>
  </linearGradient>
  <linearGradient id="hla" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clipa"><rect x="6" y="6" width="888" height="324" rx="26"/></clipPath>
  <filter id="blura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,14px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-18px)}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(var(--shift))}}
  @keyframes sheen{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1300px)}}
  .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  .drift2{animation:drift2 18s ease-in-out infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  .fill{transform-box:fill-box;transform-origin:left;animation:fill 1.4s cubic-bezier(.2,.7,.2,1) both}
  .sheen{animation:sheen 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="6" y="6" width="888" height="324" rx="26" fill="url(#bga)"/>
<g clip-path="url(#clipa)"><circle class="drift" cx="120" cy="330" r="160" fill="#1F6F4A" opacity="0.5" filter="url(#blura)"/><text x="40" y="50" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#3DDC97">01<tspan fill="#5E736A">  -  </tspan><tspan fill="#93A89F">ABOUT</tspan></text><text class="sans rise" style="animation-delay:0.10s" x="38" y="106" font-size="27" font-weight="650" letter-spacing="-.7" fill="#F2F5F1">Every interface is a promise.</text><text class="sans rise" style="animation-delay:0.22s" x="38" y="142" font-size="27" font-weight="650" letter-spacing="-.7" fill="#93A89F">The code keeps it -</text><text class="sans rise" style="animation-delay:0.34s" x="38" y="178" font-size="27" font-weight="650" letter-spacing="-.7" fill="#93A89F">the design makes people believe it.</text><text x="40" y="236" class="mono" font-size="12" fill="#5E736A">// code that</text><g class="rise" style="animation-delay:0.50s"><rect x="40" y="250" width="77.5" height="30" rx="9" fill="#3DDC97" fill-opacity=".08" stroke="#3DDC97" stroke-opacity=".25"/><text x="53" y="270" class="sans" font-size="13" font-weight="500" fill="#3DDC97">✓  works</text></g><g class="rise" style="animation-delay:0.62s"><rect x="125.4605" y="250" width="103.4" height="30" rx="9" fill="#3DDC97" fill-opacity=".08" stroke="#3DDC97" stroke-opacity=".25"/><text x="138.4605" y="270" class="sans" font-size="13" font-weight="500" fill="#3DDC97">✓  reads well</text></g><g class="rise" style="animation-delay:0.74s"><rect x="236.856" y="250" width="156.2" height="30" rx="9" fill="#3DDC97" fill-opacity=".08" stroke="#3DDC97" stroke-opacity=".25"/><text x="249.856" y="270" class="sans" font-size="13" font-weight="500" fill="#3DDC97">✓  looks good doing it</text></g><text x="40" y="306" class="mono" font-size="12" fill="#5E736A">// “it’s done - for now.” always improving, always building</text><rect x="520" y="34" width="340" height="256" rx="18" fill="#132822" stroke="#fff" stroke-opacity=".07"/><g class="rise" style="animation-delay:0.30s"><rect x="536" y="50" width="32" height="32" rx="8" fill="#1F6F4A"/><text x="552" y="71.5" text-anchor="middle" font-size="16">🎓</text><text x="582" y="63" class="sans" font-size="11.5" font-weight="500" fill="#5E736A">Studying</text><text x="582" y="81" class="sans" font-size="14.5" font-weight="600" fill="#F2F5F1">Computer Engineering</text><path d="M836 61 l5 5 l-5 5" fill="none" stroke="#5E736A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="582" y="97.5" width="278" height="1" fill="#fff" opacity=".07"/><g class="rise" style="animation-delay:0.40s"><rect x="536" y="114" width="32" height="32" rx="8" fill="#8A5A2B"/><text x="552" y="135.5" text-anchor="middle" font-size="16">⚙️</text><text x="582" y="127" class="sans" font-size="11.5" font-weight="500" fill="#5E736A">Building</text><text x="582" y="145" class="sans" font-size="14.5" font-weight="600" fill="#F2F5F1">xiux - a native Rust IDE</text><path d="M836 125 l5 5 l-5 5" fill="none" stroke="#5E736A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="582" y="161.5" width="278" height="1" fill="#fff" opacity=".07"/><g class="rise" style="animation-delay:0.50s"><rect x="536" y="178" width="32" height="32" rx="8" fill="#2E6B5E"/><text x="552" y="199.5" text-anchor="middle" font-size="16">🌱</text><text x="582" y="191" class="sans" font-size="11.5" font-weight="500" fill="#5E736A">Learning</text><text x="582" y="209" class="sans" font-size="14.5" font-weight="600" fill="#F2F5F1">React · Spring Boot</text><path d="M836 189 l5 5 l-5 5" fill="none" stroke="#5E736A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="582" y="225.5" width="278" height="1" fill="#fff" opacity=".07"/><g class="rise" style="animation-delay:0.60s"><rect x="536" y="242" width="32" height="32" rx="8" fill="#6B5A2A"/><text x="552" y="263.5" text-anchor="middle" font-size="16">📍</text><text x="582" y="255" class="sans" font-size="11.5" font-weight="500" fill="#5E736A">Based in</text><text x="582" y="273" class="sans" font-size="14.5" font-weight="600" fill="#F2F5F1">Portugal</text><path d="M836 253 l5 5 l-5 5" fill="none" stroke="#5E736A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x="6.5" y="6.5" width="887" height="323" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="32" y="6" width="836" height="1" fill="url(#hla)"/>
